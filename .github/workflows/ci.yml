name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 'stable'
      - name: Install GLFW (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw
      - name: Install GLFW + Mesa + xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3 xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa fonts-dejavu-core
      - name: Install package
        run: raco pkg install --auto --name tessera --link "$GITHUB_WORKSPACE"
      - name: Compile public entry point
        run: raco make main.rkt
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: raco test test/
      - name: Run tests (Linux, headless)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" raco test test/
